name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Single gate, defined in package.json, so CI and the documented local
      # command cannot drift apart: format:check -> lint -> build -> test.
      - name: Check
        run: npm run check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile / compose regressions that the build-test job misses.
      - name: Build image
        run: docker build -t personal-rules-mcp-server:ci .

      - name: Validate compose file
        run: docker compose config --quiet
